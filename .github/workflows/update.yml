name: Update data
on:
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch data (ESPN + public splits)
        run: python3 tools/update.py
      - name: Install headless browser
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Run picks engine (Lean Tracker)
        run: node tools/leans.js
      - name: Commit
        run: |
          git config user.name "NoFilmStudy Bot"
          git config user.email "noreply@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase -X theirs && git push)
