name: Update data
on:
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python3 tools/update.py
      - name: Commit
        run: |
          git config user.name "NoFilmStudy Bot"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
