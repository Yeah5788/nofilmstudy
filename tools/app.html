<title>NoFilmStudy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky broadcast-style header (brand · search · tabs), single 1180px column; team colors drive every heading */
:root{
  --bg:#09090a; --panel:#111113; --panel2:#18181b; --line:#26262b; --line2:#34343a;
  --fg:#f5f5f4; --dim:#a1a1a6; --mute:#6e6e75;
  --pos:#4ade80; --neg:#f87171; --warn:#fbbf24; --info:#93c5fd;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;text-decoration:none;white-space:nowrap}
.brand span{color:var(--mute);font-weight:600}
.brand{display:flex;align-items:center;gap:10px}
.logo{height:30px;width:auto;border-radius:6px;display:block;flex:none}
.brand{gap:8px}
.search{position:relative;flex:1 1 260px;min-width:0;max-width:440px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:9px 12px 9px 34px;outline:none}
.search input:focus{border-color:var(--fg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--dim)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;overflow:hidden;max-height:360px;overflow-y:auto;z-index:30}
.results a{display:flex;align-items:center;gap:10px;padding:8px 12px;text-decoration:none;border-bottom:1px solid var(--line)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.on{background:var(--line)}
.results small{color:var(--mute);margin-left:auto;font-family:var(--mono);font-size:11px}
.feed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-left:auto;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.live{background:var(--pos);box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2s infinite}
.dot.stale{background:var(--warn)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--dim);padding:8px 12px 9px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a.on{color:var(--fg);border-bottom-color:var(--fg)}

main{padding-block:24px 64px}
.notice{border:1px solid var(--line2);border-left:3px solid var(--warn);background:var(--panel);padding:12px 14px;border-radius:4px;margin-bottom:20px;font-size:13px;color:var(--dim)}
.notice b{color:var(--fg)}
.notice.slim{padding:8px 12px;font-size:12px;margin-bottom:12px}
.notice code{font-family:var(--mono);font-size:12px;color:var(--fg)}

h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,58px);font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700;letter-spacing:.05em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sub{color:var(--dim);max-width:68ch}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid2>*,.grid3>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel>h3,.panel>.ph{margin-bottom:12px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--mute)}
.dim{color:var(--dim)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.sec{margin-top:32px}
.sec>.ph{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}

/* chips/pills */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:12px;font-family:var(--mono);cursor:pointer;color:var(--dim)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.pill.rlm{color:var(--warn)} .pill.sharp{color:var(--info)} .pill.steam{color:var(--neg)} .pill.edge{color:var(--pos)} .pill.key{color:#c4b5fd} .pill.gap{color:#f0abfc} .pill.rest{color:var(--dim)}

/* team badge */
.tb{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:4px;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.02em;flex:none;border:1px solid rgba(255,255,255,.12)}
.tb.lg{width:72px;height:72px;font-size:26px;border-radius:6px}
.tb.sm{width:24px;height:24px;font-size:10px;border-radius:3px}

/* board */
.day{margin-top:26px}
.day:first-child{margin-top:0}
.day>.eyebrow{display:block;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.g{display:grid;grid-template-columns:74px minmax(190px,1.6fr) repeat(3,minmax(78px,.7fr)) minmax(92px,.8fr) minmax(150px,1.2fr);gap:12px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line);text-decoration:none;border-radius:4px}
.g:hover{background:var(--panel)}
.g .t{font-family:var(--mono);font-size:12px;color:var(--dim)}
.g .t b{display:block;color:var(--fg);font-weight:500}
.mu{display:grid;gap:6px;min-width:0}
.mu .tm{display:flex;align-items:center;gap:8px;min-width:0}
.mu .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mu .tm em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:auto}
.cell{display:grid;gap:6px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.cell .h{font-size:10px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.cell .mv{font-size:10.5px}
.sig{display:flex;gap:4px;flex-wrap:wrap}
.ghead{display:grid;grid-template-columns:74px minmax(190px,1.6fr) repeat(3,minmax(78px,.7fr)) minmax(92px,.8fr) minmax(150px,1.2fr);gap:12px;padding:0 10px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
@media (max-width:900px){
  .ghead{display:none}
  .g{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"t t t" "m m m" "a b c" "d e e";}
  .g .t{grid-area:t;display:flex;gap:8px}.g .t b{display:inline}
  .g .mu{grid-area:m}
  .g .c1{grid-area:a}.g .c2{grid-area:b}.g .c3{grid-area:c}.g .c4{grid-area:d}.g .c5{grid-area:e}
}

/* split bars */
.split{display:grid;gap:5px;font-family:var(--mono);font-size:11px}
.split .lab{display:flex;justify-content:space-between;color:var(--dim)}
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.sbar i{display:block;height:100%}

/* game / team pages */
.hero{display:grid;gap:18px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.vs .side{display:flex;align-items:center;gap:14px;min-width:0}
.vs .side.r{flex-direction:row-reverse;text-align:right}
.vs .side h1{font-size:clamp(26px,4.6vw,46px)}
.vs .at{font-family:var(--display);font-size:22px;color:var(--mute)}
.vs .rec{font-family:var(--mono);font-size:12px;color:var(--dim)}
@media (max-width:640px){.vs{grid-template-columns:1fr}.vs .side.r{flex-direction:row;text-align:left}.vs .at{display:none}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kv>div{background:var(--panel);padding:12px 14px;min-width:0}
.kv .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.kv .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.kv .s{font-size:11px;color:var(--dim);font-family:var(--mono)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.status{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.status.out{color:var(--neg)} .status.q{color:var(--warn)} .status.d{color:#fb923c}
.form{display:flex;gap:4px}
.form i{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:3px;background:var(--line)}
.form i.w{background:rgba(74,222,128,.16);color:var(--pos)} .form i.l{background:rgba(248,113,113,.14);color:var(--neg)}
.band{height:4px;border-radius:2px}
.teamhero{position:relative;padding-top:6px}
.teamhero .row{gap:18px;align-items:flex-end}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--dim)}
.brk{white-space:pre-wrap;font-size:14px;line-height:1.65;max-width:78ch}
.brk h4{font-family:var(--display);text-transform:uppercase;font-size:16px;letter-spacing:.06em;margin:14px 0 2px}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;text-transform:none;letter-spacing:0;font-size:13px;min-width:0;width:100%}
label.f input:focus,label.f select:focus{border-color:var(--fg);outline:none}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:4px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 9px;font-size:12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:4px;font-weight:600;font-size:13px;z-index:50}

/* insiders */
.acct{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.acct:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;background:var(--line);flex:none}
.acct .who{min-width:0;flex:1}
.acct .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .who span{font-family:var(--mono);font-size:12px;color:var(--mute)}
.xl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--mono);text-decoration:none;border:1px solid var(--line2);border-radius:4px;padding:5px 9px;white-space:nowrap}
.xl:hover{border-color:var(--fg)}
.xl svg{width:12px;height:12px;fill:currentColor}
.src{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 18px;padding:11px 0;border-bottom:1px solid var(--line)}
.src a{font-weight:600;text-decoration:none;border-bottom:1px solid var(--line2)}
.src a:hover{border-color:var(--fg)}
.src .tag{font-family:var(--mono);font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:2px}
@media (max-width:560px){.src{grid-template-columns:1fr}}
.play{counter-reset:p}
.play li{list-style:none;padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr;gap:12px}
.play li::before{counter-increment:p;content:counter(p,decimal-leading-zero);font-family:var(--display);font-weight:800;font-size:26px;color:var(--mute);line-height:1}
.play h3{margin-bottom:4px}
.play p{margin:0;color:var(--dim);max-width:72ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

.qr{margin:0;padding-left:18px;display:grid;gap:6px;max-width:80ch}
.qr li::marker{color:var(--mute)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.roster a{display:grid;grid-template-columns:36px 1fr auto;gap:8px;background:var(--panel);padding:8px 10px;text-decoration:none}
.roster a:hover{background:var(--panel2)}
.brk-m{display:grid;gap:8px}
.mt{border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.mt>div{display:flex;align-items:center;gap:8px;padding:6px 9px;min-width:0}
.mt>div+div{border-top:1px solid var(--line)}
.sd{font-family:var(--mono);font-size:11px;color:var(--mute);width:18px;text-align:right;flex:none}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:190px}
.bm{border:1px solid var(--line2);border-radius:4px;overflow:hidden;background:var(--panel)}
.bslot{display:flex;align-items:center;gap:8px;padding:7px 9px;font-size:13px;min-width:0}
.bslot+.bslot{border-top:1px solid var(--line)}
.bslot .muted{margin-left:auto;font-size:11px}
.bslot.tbd{min-height:39px}
.sporttabs,.subtabs,.daystrip,.ptabs,.gstrip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.sporttabs::-webkit-scrollbar,.subtabs::-webkit-scrollbar,.daystrip::-webkit-scrollbar,.ptabs::-webkit-scrollbar,.gstrip::-webkit-scrollbar{display:none}
.sporttabs a{background:none;font-family:var(--display);font-weight:800;font-size:30px;padding:4px 12px 10px;text-decoration:none;white-space:nowrap;color:var(--dim)}
.sporttabs a.on{color:var(--fg);box-shadow:inset 0 -3px 0 var(--fg)}
.sporttabs button{background:none;border:0;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.01em;color:var(--fg);padding:4px 12px 10px;cursor:pointer;position:relative;white-space:nowrap;opacity:.9}
.sporttabs button.on{color:var(--fg);opacity:1;box-shadow:inset 0 -3px 0 var(--fg)}
.sporttabs button:not(.on){color:var(--dim)}
.sporttabs .nodot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--line2);margin-left:4px;vertical-align:super}
.subtabs button,.ptabs button{background:none;border:0;font-family:var(--display);font-weight:700;font-size:20px;color:var(--dim);padding:10px 12px;cursor:pointer;white-space:nowrap}
.subtabs button.on,.ptabs button.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--fg)}
.ptabs{margin:6px 0 4px}
.daystrip button{background:none;border:0;display:grid;justify-items:center;gap:0;min-width:74px;padding:10px 6px;cursor:pointer;color:var(--dim)}
.daystrip button span{font-size:12px}.daystrip button b{font-family:var(--display);font-size:22px;font-weight:700}
.daystrip button.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--fg)}
.daystrip button.none{opacity:.35}
.lnk{font-family:var(--display);font-weight:700;font-size:18px;text-decoration:none}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gcard{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--bg);padding:14px;text-decoration:none;min-width:0}
.gcard:hover{background:var(--panel)}
.gcard.wide{border:1px solid var(--line);border-radius:8px}
.gc-teams{display:grid;gap:12px;min-width:0}
.gc-t{display:flex;align-items:center;gap:12px;min-width:0}
.gc-t .tb{width:40px;height:40px;font-size:12px}
.gc-n{display:grid;min-width:0}.gc-n b{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}.gc-n span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lean{font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--pos);border:1px solid currentColor;border-radius:3px;padding:1px 4px}
.gc-meta{display:grid;align-content:center;justify-items:end;text-align:right;gap:3px;font-size:13px;color:var(--dim)}
.gc-meta b{font-family:var(--display);font-size:22px;color:var(--fg)}
.gc-meta .fav{color:var(--fg);font-family:var(--mono);font-size:12px}
.gc-meta .ang{font-family:var(--mono);font-size:11px;color:var(--info)}.gc-meta .mine{font-family:var(--mono);font-size:11px;color:var(--pos)}
.gstrip{align-items:center;margin-bottom:10px}
.gstrip a{display:grid;justify-items:center;padding:8px 12px;text-decoration:none;color:var(--dim);white-space:nowrap;font-size:13px}
.gstrip a b{font-size:12px}.gstrip a.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--fg)}
.gstrip .back{font-size:26px;line-height:1;padding:4px 14px;border:1px solid var(--line2);border-radius:50%;margin-right:6px}
.ghead{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:14px 0 18px}
.gh-side{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}.gh-side.r{justify-content:flex-end;text-align:right}
.gh-side b{display:block;font-family:var(--display);font-size:38px;line-height:1}.gh-side span{font-size:15px}
.gh-mid{display:grid;justify-items:center;text-align:center;gap:2px}.gh-mid b{font-family:var(--display);font-size:30px}.gh-mid span{font-size:13px;color:var(--dim)}
@media (max-width:560px){.ghead .tb.lg{width:44px;height:44px;font-size:15px}.gh-side b{font-size:28px}.gh-mid b{font-size:22px}}
.edgebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;padding:16px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}

 for(let i=1;i<L.length;i++){const a=L[i-1],b=L[i];if(a.spread!=null&&b.spread!=null&&Math.abs(b.spread-a.spread)>=lg.move&&(new Date(b.ts)-new Date(a.ts))<=45*60000){out.push(["steam","Fast move","The spread jumped "+fmtSigned(b.spread-a.spread)+" in under 45 minutes, usually news or a wave of sharp bets"]);break}}

function autoGrade(b){if(b.result)return b.result;const g=S.games.find(x=>x.id===b.gameId);if(!g||g.status!=="closed"||!g.score)return null;
 const m=(g.score.h-g.score.a)*(b.side==="home"?1:-1);
 if(b.market==="Spread"&&b.line!=null){const d=m+b.line;return d>0?"W":d<0?"L":"P"}
 if(b.market==="Moneyline")return m>0?"W":m<0?"L":"P";
 if(b.market==="Total"&&b.line!=null){const t=g.score.h+g.score.a;const d=(b.side==="over"?1:-1)*(t-b.line);return d>0?"W":d<0?"L":"P"}
 return null}
let settling=false;
async function autoSettle(){if(!S.db||!S.uid||settling)return;const todo=S.bets.filter(b=>!b.result&&autoGrade(b));if(!todo.length)return;settling=true;
 try{for(const b of todo){try{await S.db.doc(UP("bets")+"/"+b.id).update({result:autoGrade(b),auto:true,gradedAt:new Date().toISOString()})}catch(e){}}}finally{settling=false}}
const unitsOf=b=>{const r=b.result||autoGrade(b);return r==="W"?+b.units:r==="L"?-b.units:0};
function tally(list){const r={W:0,L:0,P:0,u:0,open:0};for(const b of list){const res=b.result||autoGrade(b);if(!res){r.open++;continue}r[res]++;r.u+=unitsOf(b)}return r}
const recStr=r=>`${r.W}-${r.L}${r.P?"-"+r.P:""}`;
const winPct=r=>r.W+r.L?(r.W/(r.W+r.L)*100).toFixed(1)+"%":"—";
const uStr=u=>(u>0?"+":"")+(+u).toFixed(Math.abs(u%1)>0?1:0)+"u";
const uCls=u=>u>0?"pos":u<0?"neg":"";
const trkReset=()=>S.baselines&&S.baselines._reset&&S.baselines._reset.ts||null;
function trkBets(){const r=trkReset();return r?S.bets.filter(b=>new Date(b.ts)>=new Date(r)):S.bets}
function sportTotals(sp){const r=trkReset();let base=S.baselines[sp]||{w:0,l:0,p:0,units:0};if(r&&!(base.ts&&base.ts>r))base={w:0,l:0,p:0,units:0};const live=tally(trkBets().filter(b=>b.sport===sp));return {W:live.W+(+base.w||0),L:live.L+(+base.l||0),P:live.P+(+base.p||0),u:live.u+(+base.units||0),open:live.open,base,live}}
function grandTotal(){const t={W:0,L:0,P:0,u:0,open:0};for(const [sp] of SPORTS){const s=sportTotals(sp);t.W+=s.W;t.L+=s.L;t.P+=s.P;t.u+=s.u;t.open+=s.open}return t}

function mkSplit(g,mk){const s=g.splits||{};if(mk==="spread")return s.betsH!=null||s.handleH!=null?{bets:s.betsH,money:s.handleH,a:"away",b:"home"}:null;if(mk==="ml")return s.mlBetsH!=null||s.mlHandleH!=null?{bets:s.mlBetsH,money:s.mlHandleH,a:"away",b:"home"}:null;if(mk==="total")return s.betsO!=null||s.handleO!=null?{bets:s.betsO,money:s.handleO,a:"under",b:"over"}:null;return null}
function sideLabel(g,mk,side){const A=gName(g,"a"),H=gName(g,"h"),o=g.odds||{};if(mk==="total")return `${side==="over"?"Over":"Under"} ${o.total??""}`;const t=side==="home"?H:A;if(mk==="spread")return `${t.ab} ${o.spread!=null?fmtSigned(side==="home"?o.spread:-o.spread):""}`;const ml=side==="home"?o.mlH:o.mlA;return `${t.ab} ${ml!=null?fmtML(ml):"ML"}`}
function bookPos(g,mk){const x=mkSplit(g,mk);if(!x||x.money==null)return null;const heavy=x.money>=50?x.b:x.a,money=Math.max(x.money,100-x.money),needs=heavy===x.b?x.a:x.b;const lvl=money>=90?["Extreme","neg"]:money>=75?["Heavy","warn"]:money>=60?["Moderate","info"]:["Balanced","muted"];return {needs,heavy,money,exposure:2*money-100,lvl,needsLabel:sideLabel(g,mk,needs),heavyLabel:sideLabel(g,mk,heavy)}}
function bookPanel(g){const mkL={spread:"Spread",ml:"Moneyline",total:"Total"};const rows=["spread","ml","total"].map(m=>[m,bookPos(g,m)]).filter(r=>r[1]);if(!rows.length)return "";

function basisWhy(g,b,kind){const s=g.splits||{};if(b==="book")return kind==="total"?`tiebreaker: most of the money (${Math.max(s.handleO,100-s.handleO)}%) is on the other side and the book needs this one`:`tiebreaker: the book needs this side (${Math.max(s.handleH??s.mlHandleH,100-(s.handleH??s.mlHandleH))}% of the money is on the other side)`;if(b==="bigmoney")return kind==="total"?"tiebreaker: the bigger bets (money % vs ticket %) are on this side":"tiebreaker: the bigger bets (money % vs ticket %) are on this side";if(b==="modelfav"){const m=market(g);const p=m.model?Math.max(m.model.h,m.model.a):null;return m.o.spread==null&&m.o.mlH==null?`Sportradar's model gives them a ${pct(p,0)} chance to win; no sportsbook line in our sources to compare against`:"tiebreaker: our model's favorite to win (no line-value angles yet)"}if(b==="marketfav")return "tiebreaker: the betting market's favorite (no other data yet)";if(b==="model"){const m=market(g),P=projection(g),H=gName(g,"h");if(kind==="total")return P.tot!=null&&m.o.total!=null?`our projected total ${P.tot.toFixed(1)} vs posted ${m.o.total} (thin edge)`:"our projected total vs the posted total";if(P.sp!=null&&m.o.spread!=null&&Math.abs(m.o.spread-P.sp)>=.25)return `our projection ${H.ab} ${fmtSigned(Math.round(P.sp*10)/10)} vs book ${H.ab} ${fmtSigned(m.o.spread)} (thin edge)`;return m.edgeH!=null?`model win % vs market win % differ by ${(Math.abs(m.edgeH)*100).toFixed(1)} pts: near coin flip`:"our projected line vs the book"}return ""}
/* ---------- final decision engine ----------
 How sharp quants decide (Pinnacle/market-making approach):
 1) Start from the market: the devigged line is the best single estimate of the true price.
 2) Move off it only with evidence: our projection (shrunk 50% toward the market), sharp-money signals
    (2+ of: contrarian ticket %, money % ahead of ticket %, reverse line move), situational spots (rest).
 3) Convert to a win probability for each side, compare with the break-even of the actual price
    (52.4% at -110), and bet only positive expected value. Size with fractional Kelly → 1–3 units.
 4) Everything else is a PASS. Most games should be passes. */
const SIGMA={nfl:13.5,nba:12,ncaaf:16,ncaab:11,nhl:1.6,mlb:3,soccer:1.3,ufc:1};
const TSIGMA={nfl:10,nba:18,ncaaf:14,ncaab:16,nhl:1.9,mlb:3.2,soccer:1.5,ufc:1};
const LIVE_H={nfl:3.6,ncaaf:4,nba:2.8,ncaab:2.4,nhl:3,mlb:3.6,soccer:2.1,ufc:6};
function nCdf(x){const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
const clampP=p=>Math.min(.97,Math.max(.03,p));
function spTxt(g,spH){const A=gName(g,"a"),H=gName(g,"h");if(spH==null)return "—";const r=Math.round(spH*2)/2;if(r===0)return "Pick'em";return r<0?`${H.ab} ${fmtSigned(r)}`:`${A.ab} ${fmtSigned(-r)}`}
function isLive(g){if(g.status==="inprogress")return true;if(g.status==="closed"||g.timeTBA)return false;const st=new Date(g.start).getTime(),n=Date.now();return st<=n&&n-st<(LIVE_H[g.league]||3)*3600e3}

function moneyRead(g,mk){const s=g.splits||{};let bk,mn,a,b;
 if(mk==="spread"){bk=s.betsH;mn=s.handleH;a="away";b="home"}else if(mk==="ml"){bk=s.mlBetsH;mn=s.mlHandleH;a="away";b="home";if(bk==null&&mn==null){bk=s.betsH;mn=s.handleH}}else{bk=s.betsO;mn=s.handleO;a="under";b="over"}
 if(bk==null&&mn==null)return null;

 if(mk!=="total"){const f=L.find(l=>l.spread!=null),l=[...L].reverse().find(l=>l.spread!=null);const s0=f?f.spread:op.spread,s1=l?l.spread:o.spread;if(s0!=null&&s1!=null&&s0!==s1)mv={from:s0,to:s1,d:s1-s0}}

 const read=x=>{const tk=bk==null?null:Math.round(x===b?bk:100-bk),m=mn==null?null:Math.round(x===b?mn:100-mn);const contr=tk!=null&&tk<=40,gap=tk!=null&&m!=null&&m-tk>=10;
  let rlm=false;if(mv){const toward=mk==="total"?(x==="over"?mv.d>0:mv.d<0):(x==="home"?mv.d<0:mv.d>0);rlm=toward&&tk!=null&&tk<50}
  const n=(gap?1:0)+(rlm?1:0)+(contr&&(gap||rlm)?1:0);return {side:x,tk,m,contr,gap,rlm,n}};
 const ra=read(a),rb=read(b);const pub=bk!=null?(bk>=50?rb:ra):null;const sharp=ra.n>rb.n?ra:rb.n>ra.n?rb:null;

function calib(){const done=S.games.filter(g=>g.status==="closed"&&g.score);const key=S.games.length+"|"+done.length;if(S._cal&&S._cal.key===key)return S._cal.c;
 const cnt={};const add=(k,win)=>{(cnt[k]=cnt[k]||[0,0])[win?0:1]++};
 for(const g of done){const o=g.odds||{},sp=g.splits||{};if(o.spread==null)continue;const m=g.score.h-g.score.a+o.spread;if(m===0)continue;const hc=m>0;
  add("fav:"+g.league,o.spread<0?hc:!hc);add("home:"+g.league,hc);

 return `<div class="ph" style="margin-bottom:6px"><div><span class="eyebrow">The quant's own record · sized like the final decisions (BET 1–3u, LEAN 0.5u, PASS 0u) · separate from your bets</span><h1 style="margin-top:4px">Lean Tracker</h1>${S.leanReset?`<div class="mono muted" style="font-size:11px;margin-top:4px">Record reset ${dShort.format(new Date(S.leanReset))}</div>`:""}</div><button class="btn ghost" data-lnreset="ask">Reset tracker</button></div>${S.lnConfirm?`<div class="confirmbox" style="margin-bottom:18px"><b>Are you sure you want to reset the Lean Tracker to 0-0?</b><span class="dim" style="font-size:13px">The record starts over from right now. Earlier leans are hidden, not deleted.</span><div class="row"><button class="btn" style="background:var(--neg);color:#fff" data-lnreset="yes">Yes, reset to 0-0</button><button class="btn ghost" data-lnreset="no">Cancel</button></div></div>`:""}

 <div class="totals"><div><span class="eyebrow">Units</span><div class="big ${uCls(t.u)}">${uStr(t.u)}</div></div><div><span class="eyebrow">Record</span><div class="big">${recStr(t)}</div></div><div><span class="eyebrow">Win rate</span><div class="big">${winPct(t)}</div><div class="mono dim" style="font-size:11px">52.4% breaks even at −110</div></div><div><span class="eyebrow">Pending</span><div class="big">${t.open}</div></div>${(()=>{const cl=list.map(clvOf).filter(x=>x!=null);if(!cl.length)return "";const beat=cl.filter(x=>x>0).length,same=cl.filter(x=>x===0).length,mv=cl.length-same,avg=cl.reduce((a,b)=>a+b,0)/cl.length;if(!mv)return `<div><span class="eyebrow">Beat the closing line</span><div class="big muted">—</div><div class="mono dim" style="font-size:11px">${cl.length} spread picks · none had the line move yet</div></div>`;return `<div><span class="eyebrow" data-tip="Closing line value: did we get a better number than the final line before tip-off? Pros treat this as the best long-run sign of a real edge, even when a single bet loses." tabindex="0">Beat the closing line ⓘ</span><div class="big ${avg>0?"pos":avg<0?"neg":""}">${beat} of ${mv}</div><div class="mono dim" style="font-size:11px">avg ${avg>=0?"+":""}${avg.toFixed(2)} pts when the line moved · ${same} picks had no move</div></div>`})()}</div>
 <div class="explain"><b>How to read this:</b> every pick the app makes is saved before the game and graded automatically. A unit is your standard bet size. You need to win 52.4% of bets at −110 just to break even, so a 55% record is very good. "Beat the closing line" shows whether we got a better number than where the line finished — the stat pros trust most, because over time getting better numbers is what beats the books.</div>
